name: Build OpenWrt CM5 (zh-cn + HomeProxy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: '/mnt/build'

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd \
            python3-pyelftools python3-pip

      - name: 拉取官方 OpenWrt 源码（正式版分支，非 SNAPSHOT）
        run: |
          cd /mnt/build
          git clone -b openwrt-25.12 --depth=1 https://github.com/openwrt/openwrt.git openwrt

      - name: 拉取 HomeProxy 源码到 package 目录
        run: |
          cd /mnt/build/openwrt
          git clone --depth=1 https://github.com/immortalwrt/homeproxy package/homeproxy

      - name: 更新 feeds
        run: |
          cd /mnt/build/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 检查软件包是否存在
        run: |
          cd /mnt/build/openwrt
          test -f package/homeproxy/luci-app-homeproxy/Makefile && echo "homeproxy 包目录结构正常" || echo "警告：未找到 luci-app-homeproxy，请检查 clone 结果"

      - name: 生成设备配置（含中文语言包与 HomeProxy）
        run: |
          cd /mnt/build/openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_bcm27xx=y
          CONFIG_TARGET_bcm27xx_bcm2712=y
          CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          make defconfig

      - name: 确认关键配置已生效
        run: |
          cd /mnt/build/openwrt
          echo "---- 设备 ----"
          grep "CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5" .config || echo "警告：设备未选中"
          echo "---- HomeProxy ----"
          grep "CONFIG_PACKAGE_luci-app-homeproxy" .config || echo "警告：homeproxy 未选中"
          echo "---- 中文语言 ----"
          grep "CONFIG_LUCI_LANG_zh_Hans" .config || echo "警告：中文语言包未选中"

      - name: 完整编译
        run: |
          cd /mnt/build/openwrt
          make -j$(nproc) V=s

      - name: 收集产物
        run: |
          mkdir -p /mnt/build/output
          cp /mnt/build/openwrt/bin/targets/bcm27xx/bcm2712/*sysupgrade* /mnt/build/output/ 2>/dev/null || true
          cp /mnt/build/openwrt/bin/targets/bcm27xx/bcm2712/sha256sums /mnt/build/output/ 2>/dev/null || true

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-cm5-zhcn-homeproxy
          path: /mnt/build/output/
          retention-days: 14

