name: Build ImmortalWrt CM5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: '/mnt/build'

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget zstd \
          python3-pyelftools python3-pip

      # 当前最新正式版 tag 为 v25.12.1（已在 Firmware Selector 和 GitHub Tags 核实一致）。
      # 如果之后有更新的正式版，请到 https://github.com/immortalwrt/immortalwrt/tags 核对后替换。
      - name: 拉取 ImmortalWrt 源码（正式版 tag）
        run: |
          cd /mnt/build
          git clone -b v25.12.1 --depth=1 https://github.com/immortalwrt/immortalwrt.git

      - name: 更新 feeds
        run: |
          cd /mnt/build/immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成设备配置
        run: |
          cd /mnt/build/immortalwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_bcm27xx=y
          CONFIG_TARGET_bcm27xx_bcm2712=y
          CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y

          # ---- HomeProxy / sing-box 核心与依赖 ----
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ucode-mod-digest=y

          # ---- TUN 模式必需 ----
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_ip-full=y

          # ---- 连接状态/分流相关内核模块（与 E52C 版本保持一致） ----
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y

          # ---- HTTPS / 规则集下载 / apk 在线安装 ----
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_libustream-mbedtls=y
          CONFIG_PACKAGE_zlib=y
          CONFIG_PACKAGE_libpcre2=y
          CONFIG_PACKAGE_curl=y

          # ---- 远程管理（SFTP / 终端）----
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          # ---- Web 界面体验（主题 / 中文 / 文件管理）----
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-app-filebrowser=y

          # ---- 外接存储（如有 U 盘/硬盘需求，用不到可删）----
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-diskman=y
          EOF
          make defconfig

      - name: 完整编译
        run: |
          cd /mnt/build/immortalwrt
          make -j$(nproc) V=s

      - name: 收集产物
        run: |
          mkdir -p /mnt/build/output
          cp /mnt/build/immortalwrt/bin/targets/bcm27xx/bcm2712/*sysupgrade* /mnt/build/output/ 2>/dev/null || true
          cp /mnt/build/immortalwrt/bin/targets/bcm27xx/bcm2712/*factory* /mnt/build/output/ 2>/dev/null || true
          cp /mnt/build/immortalwrt/bin/targets/bcm27xx/bcm2712/sha256sums /mnt/build/output/

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-cm5
          path: /mnt/build/output/
