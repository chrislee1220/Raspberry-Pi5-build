name: Build OpenWrt CM5 zh-cn HomeProxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: /mnt/build

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget curl zstd device-tree-compiler

      - name: Clone official OpenWrt
        run: |
          cd /mnt/build
          git clone --depth=1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Add HomeProxy package
        run: |
          cd /mnt/build/openwrt
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git package/homeproxy

      - name: Update feeds
        run: |
          cd /mnt/build/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check HomeProxy source
        run: |
          cd /mnt/build/openwrt
          test -f package/homeproxy/luci-app-homeproxy/Makefile

      - name: Generate config
        run: |
          cd /mnt/build/openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_bcm27xx=y
          CONFIG_TARGET_bcm27xx_bcm2712=y
          CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_ucode-mod-digest=y
          CONFIG_PACKAGE_ca-bundle=y
          EOF

          make defconfig
          make info

      - name: Verify config
        run: |
          cd /mnt/build/openwrt
          grep -q '^CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y' .config
          grep -q '^CONFIG_PACKAGE_luci=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y' .config
          grep -q '^CONFIG_PACKAGE_sing-box=y' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' .config
          grep '^CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y' .config || true

      - name: Download sources
        run: |
          cd /mnt/build/openwrt
          make download -j8

      - name: Build firmware
        run: |
          cd /mnt/build/openwrt
          make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p /mnt/build/output
          cp /mnt/build/openwrt/bin/targets/bcm27xx/bcm2712/* /mnt/build/output/ 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-cm5-25.12.5-zhcn-homeproxy
          path: /mnt/build/output/
          retention-days: 14


