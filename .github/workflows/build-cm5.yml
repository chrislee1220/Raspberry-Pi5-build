name: Build OpenWrt CM5 zh-cn HomeProxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 释放磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: '/mnt/build'

      - name: 检查磁盘空间
        run: |
          df -h

      - name: 安装编译依赖
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd \
            python3-pyelftools python3-pip
          sudo apt-get clean
          df -h

      - name: 拉取官方 OpenWrt 源码
        run: |
          cd /mnt/build
          git clone -b v25.12.5 --depth=1 https://github.com/openwrt/openwrt.git openwrt

      - name: 拉取 HomeProxy 源码到 package 目录
        run: |
          cd /mnt/build/openwrt
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git package/homeproxy

      - name: 更新 feeds
        run: |
          cd /mnt/build/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 检查 HomeProxy 包是否存在
        run: |
          cd /mnt/build/openwrt
          test -f package/homeproxy/Makefile
          grep -q "PKG_NAME:=luci-app-homeproxy" package/homeproxy/Makefile
          echo "HomeProxy 包目录结构正常"

      - name: 生成设备配置
        run: |
          cd /mnt/build/openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_bcm27xx=y
          CONFIG_TARGET_bcm27xx_bcm2712=y
          CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_ucode-mod-digest=y
          CONFIG_PACKAGE_ca-bundle=y
          EOF

          make defconfig
          make info

      - name: 确认关键配置已生效
        run: |
          cd /mnt/build/openwrt
          grep "^CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y" .config
          grep "^CONFIG_PACKAGE_luci=y" .config
          grep "^CONFIG_PACKAGE_luci-app-homeproxy=y" .config
          grep "^CONFIG_PACKAGE_sing-box=y" .config
          grep "^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" .config

      - name: 下载源码包
        timeout-minutes: 60
        run: |
          cd /mnt/build/openwrt
          make download -j8

      - name: 完整编译
        timeout-minutes: 150
        run: |
          cd /mnt/build/openwrt
          make -j$(nproc) V=s

      - name: 收集产物
        if: always()
        run: |
          mkdir -p /mnt/build/output
          cp /mnt/build/openwrt/bin/targets/bcm27xx/bcm2712/*ext4*sysupgrade.img.gz /mnt/build/output/ 2>/dev/null || true
          cp /mnt/build/openwrt/bin/targets/bcm27xx/bcm2712/sha256sums /mnt/build/output/ 2>/dev/null || true
          cp /mnt/build/openwrt/bin/targets/bcm27xx/bcm2712/*.manifest /mnt/build/output/ 2>/dev/null || true

      - name: 上传固件到 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-cm5-25.12.5-zhcn-homeproxy
          path: /mnt/build/output/
          retention-days: 14


