name: Build OpenWrt CM5 zh-cn HomeProxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Cleanup disk
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl zstd subversion time
          sudo apt-get clean
          df -h

      - name: Clone official OpenWrt
        run: |
          git clone --depth=1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Add HomeProxy package
        run: |
          cd openwrt
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git package/homeproxy
          test -f package/homeproxy/Makefile
          grep -q "PKG_NAME:=luci-app-homeproxy" package/homeproxy/Makefile
          grep -q "+sing-box" package/homeproxy/Makefile

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt

          wget -O .config https://downloads.openwrt.org/releases/25.12.5/targets/bcm27xx/bcm2712/config.buildinfo

          cat >> .config << 'EOF'
          CONFIG_TARGET_bcm27xx=y
          CONFIG_TARGET_bcm27xx_bcm2712=y
          CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-homeproxy=y
          EOF

          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          grep "^CONFIG_TARGET_bcm27xx_bcm2712_DEVICE_rpi-5=y" .config
          grep "^CONFIG_PACKAGE_luci=y" .config
          grep "^CONFIG_PACKAGE_luci-app-homeproxy=y" .config
          grep "^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" .config
          grep "CONFIG_PACKAGE_sing-box" .config || true

      - name: Download sources
        timeout-minutes: 60
        run: |
          cd openwrt
          make download -j8

      - name: Build firmware
        timeout-minutes: 150
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=sc

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp openwrt/bin/targets/bcm27xx/bcm2712/*ext4*sysupgrade.img.gz output/
          cp openwrt/bin/targets/bcm27xx/bcm2712/sha256sums output/
          cp openwrt/bin/targets/bcm27xx/bcm2712/*.manifest output/ 2>/dev/null || true
          cp openwrt/.config output/openwrt-build-config.txt
          df -h

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-cm5-25.12.5-zhcn-homeproxy
          path: output/
          if-no-files-found: error
          retention-days: 14



